<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>PJ Invoice Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;700&display=swap">
<style>
:root{ --bg:#EDF1EF; --surface:#FFFFFF; --fg:#16201C; --muted:#5A6762; --line:#D2DBD7; --accent:#1D5C4A; --accent-fg:#FFFFFF; --accent-soft:#E1EDE7; --field:#F7FAF8; --danger:#A33A2C;
  --font-ui:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif; color-scheme:light }
@media (prefers-color-scheme: dark){ :root{ --bg:#0F1513; --surface:#17201C; --fg:#E4EBE8; --muted:#98A6A0; --line:#2A3531; --accent:#62B898; --accent-fg:#0A1411; --accent-soft:#1D2E27; --field:#111916; --danger:#E58472; color-scheme:dark } }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:15px;line-height:1.45;display:flex;align-items:center;justify-content:center;
  padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px 24px;display:flex;flex-direction:column;gap:16px}
.mark{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center}
.mark svg{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:20px;margin:0;letter-spacing:-.01em}
p{margin:0;color:var(--muted);font-size:14px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.pw{position:relative}
input[type=password],input[type=text]{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:11px 64px 11px 12px}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.show{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--accent);font:inherit;font-size:13px;font-weight:600;padding:6px 8px;border-radius:6px;cursor:pointer}
.check{flex-direction:row;align-items:center;gap:8px;font-weight:500;color:var(--fg);cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent);margin:0}
button.go{font:inherit;font-weight:600;font-size:15px;border:0;border-radius:8px;padding:11px 14px;background:var(--accent);color:var(--accent-fg);cursor:pointer}
button.go:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{color:var(--danger);font-size:13px;min-height:1.2em}
.wait{display:flex;flex-direction:column;gap:4px;border:1px solid var(--danger);border-radius:8px;padding:10px 12px;background:var(--field)}
.wait b{font-size:14px;color:var(--fg)} .wait span{font-size:13px;color:var(--muted)}
.wait .cd{font-variant-numeric:tabular-nums;color:var(--danger);font-weight:700}
input:disabled{opacity:.6;cursor:not-allowed}
</style>
</head>
<body>
<form class="card" id="lockform" autocomplete="on" hidden>
  <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
  <div><h1>Invoice Builder</h1><p>Enter your password to open it.</p></div>
  <input type="text" name="username" value="invoice-builder" autocomplete="username" hidden>
  <label for="pw">Password
    <span class="pw"><input type="password" id="pw" autocomplete="current-password" required><button type="button" class="show" id="show" aria-label="Show password">Show</button></span>
  </label>
  <label class="check"><input type="checkbox" id="remember" checked> Remember this device</label>
  <div class="wait" id="wait" hidden role="status" aria-live="polite"><b>Too many wrong passwords</b><span>Try again in <span class="cd" id="cd">1:00</span></span></div>
  <div class="err" id="err" role="alert"></div>
  <button type="submit" class="go" id="go">Unlock</button>
</form>
<noscript><p style="padding:24px">Turn on JavaScript to open the Invoice Builder.</p></noscript>

const SK="pj-invoice-unlock";
const enc=new TextEncoder(), dec=new TextDecoder();
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const tob64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const $=id=>document.getElementById(id);

async function deriveRaw(pw){
  const base=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveBits"]);
  return crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:b64(P.s),iterations:P.n},base,256);
}
async function unlock(raw){
  const key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  return dec.decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.i)},key,b64(P.c)));
}
async function show(html){
  if(document.readyState!=="complete") await new Promise(r=>window.addEventListener("load",r,{once:true}));
  document.open(); document.write(html); document.close();
}
function store(k,v,persist){ try{ (persist?localStorage:sessionStorage).setItem(k,v); }catch(e){} }
function read(k){ try{ return localStorage.getItem(k)||sessionStorage.getItem(k); }catch(e){ return null; } }
function forget(){ try{ localStorage.removeItem(SK); sessionStorage.removeItem(SK); }catch(e){} }

// Wrong-password lockout: 5 tries, then waits of 1, 5, 15 and 60 minutes. One wrong try after a wait starts the next wait.
// It lives in this browser only (the page has no server), so it slows down guessing here; the password itself is the real lock.
const LK="pj-invoice-lockout", TRIES=5, WAITS=[1,5,15,60];
let mem=null;
function lkGet(){ let v=null; try{ v=JSON.parse(localStorage.getItem(LK)||"null"); }catch(e){ v=mem; }
  v=v||{fails:0,level:0,until:0,last:0};
  if(v.last && Date.now()-v.last>24*3600e3 && Date.now()>=v.until) v={fails:0,level:0,until:0,last:0};
  return v; }
function lkSet(v){ mem=v; try{ if(v) localStorage.setItem(LK,JSON.stringify(v)); else localStorage.removeItem(LK); }catch(e){} }
const mins=m=>m>=60? (m/60)+" hour"+(m>60?"s":"") : m+" minute"+(m>1?"s":"");
function fmtLeft(ms){ const t=Math.ceil(ms/1000), m=Math.floor(t/60), s=t%60; return m+":"+String(s).padStart(2,"0"); }
let tick=null;
function lockUI(){
  const v=lkGet(), left=v.until-Date.now(), locked=left>0;
  $("wait").hidden=!locked; $("err").hidden=locked; $("pw").disabled=locked; $("go").disabled=locked; $("show").disabled=locked;
  clearInterval(tick);
  if(locked){ $("cd").textContent=fmtLeft(left); $("err").textContent="";
    tick=setInterval(()=>{ const l=lkGet().until-Date.now(); if(l>0){ $("cd").textContent=fmtLeft(l); return; } clearInterval(tick); lockUI(); },250); }
  else if(v.level>0 && !$("err").textContent){ $("err").textContent="You can try again. One more wrong password locks it for "+mins(WAITS[Math.min(v.level,WAITS.length-1)])+"."; }
  if(!locked && document.activeElement!==$("pw") && !$("lockform").hidden) $("pw").focus();
  return locked;
}
function wrongPassword(){
  const v=lkGet(); v.fails++; v.last=Date.now();
  if(v.level>0 || v.fails>=TRIES){ const m=WAITS[Math.min(v.level,WAITS.length-1)]; v.until=Date.now()+m*60e3; v.level++; v.fails=0; lkSet(v); return null; }
  lkSet(v); return TRIES-v.fails;
}

async function boot(){
  if(!window.crypto || !crypto.subtle){ $("lockform").hidden=false; $("err").textContent="This browser can't unlock the page. Open it in an up-to-date Chrome, Safari, Edge or Firefox."; $("go").disabled=true; return; }
  const saved=read(SK);
  if(saved){
    let html=null;
    try{ html=await unlock(b64(saved)); }catch(e){ forget(); }
    if(html){ await show(html); return; }
  }
  $("lockform").hidden=false; $("pw").focus(); lockUI();
}

$("show").addEventListener("click",()=>{ const i=$("pw"), s=i.type==="password"; i.type=s?"text":"password"; $("show").textContent=s?"Hide":"Show"; $("show").setAttribute("aria-label",s?"Hide password":"Show password"); i.focus(); });
$("lockform").addEventListener("submit",async e=>{
  e.preventDefault();
  const pw=$("pw").value; if(!pw) return;
  if(lockUI()) return;
  $("go").disabled=true; $("go").textContent="Unlocking…"; $("err").textContent="";
  try{
    const raw=await deriveRaw(pw);
    const html=await unlock(raw);
    forget(); store(SK,tob64(raw),$("remember").checked); lkSet(null);
    await show(html);
    return;
  }catch(err){
    $("go").disabled=false; $("go").textContent="Unlock";
    const left=wrongPassword();
    $("err").textContent = left===null ? "" : "That password didn't work. Check caps lock and try again. "+left+(left===1?" try":" tries")+" left before a "+mins(WAITS[0])+" wait.";
    $("pw").value="";
    lockUI();
  }
});
window.addEventListener("storage",e=>{ if(e.key===LK && !$("lockform").hidden) lockUI(); });
boot();
})();
</script>
